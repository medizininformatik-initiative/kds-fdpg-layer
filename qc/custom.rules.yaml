# Firely Quality-Control-Regeln fuer den FDPG KDS Obligations Layer.
#
# Gelesen von .github/workflows/main.yml (Firely-Action, PATH_TO_QUALITY_
# CONTROL_RULES: qc/custom) — gleiches Muster wie die MII-KDS-Module.
# Ohne eigene Regeldatei laeuft das Firely-Standardset "minimal" inkl.
# claims-check, der ohne Simplifier-Projekt immer warnt und mit --fail den
# Job rot macht (CI 37946336685).
#
# Syntax: https://simplifier.net/docs/qualitycontrol/

- action: parse
  name: parse-fhir-resources
  status: "Checking if all FHIR resource files can be parsed"
  files:
    - /fsh-generated/resources/*.json
    - "!**/ImplementationGuide-*.json"
    # ActorDefinition ist R5 (via sushi-r5forR4); der R4-Parser von Firely kennt sie nicht.
    - "!**/ActorDefinition-*.json"

- action: validate
  name: resource-validation
  status: "Validating generated conformance resources against the FHIR standard and their profiles"
  category: Resource
  files:
    - /fsh-generated/resources/*.json
    # IG-Publisher-Parameter (i18n-lang, releaselabel, ...) liegen nicht im
    # R4-ValueSet guide-parameter-code — die IG-Ressource wird nur vom
    # IG-Publisher-Job verarbeitet.
    - "!**/ImplementationGuide-*.json"
    - "!**/ActorDefinition-*.json"
  suppress:
    - 6005
    - eld-16
    # 6006: Firelys lokaler Terminologie-Service kann das ValueSet
    # http://hl7.org/fhir/ValueSet/obligation (Filter not-in) nicht expandieren;
    # jede Obligation (handle/display/pre-select) wuerde sonst eine Warnung werfen.
    - 6006

- action: unique
  name: unique-canonicals
  status: "Checking if all StructureDefinitions have a unique canonical"
  category: StructureDefinition
  unique: url
  files:
    - /fsh-generated/resources/*.json

- name: version-filled
  status: "Checking that every generated conformance resource carries the layer version"
  filter: (StructureDefinition or CodeSystem or CapabilityStatement).exists()
  predicate: version.exists()
  error-message: "version missing on a generated conformance resource (FDPGVersion-RuleSet / CPS)"
  files:
    - /fsh-generated/resources/*.json
    - "!**/ImplementationGuide-*.json"
    - "!**/ActorDefinition-*.json"

- name: naming-convention-id
  status: "Checking the id naming convention (fdpg-<prefix>-…)"
  category: StructureDefinition
  predicate: id.matches('^fdpg-(pr|cs|actor)-')
  error-message: "StructureDefinition id must start with fdpg-pr-"
  files:
    - /fsh-generated/resources/StructureDefinition-*.json

- name: naming-convention-name
  status: "Checking the name naming convention (FDPG_PR_…)"
  category: StructureDefinition
  predicate: name.matches('^FDPG_PR_')
  error-message: "StructureDefinition name must start with FDPG_PR_"
  files:
    - /fsh-generated/resources/StructureDefinition-*.json

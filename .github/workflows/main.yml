name: CI (FHIR Validation, IG Build & Deploy)

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  # Eigener Job statt kerndatensatz-meta/ci_dotnet_validation.yml: der
  # geteilte Workflow laesst sich nicht mit dem Paket-Cache primen, SUSHI
  # bricht dort an den snapshotlosen ISiK-Parents ab. Schritte wie upstream.
  DOTNET_FHIR_VALIDATION:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    env:
      # ISiK 6 + transitive Pakete sprengen den 4-GB-Standard-Heap von Node;
      # ubuntu-latest (public repo) hat 16 GB RAM.
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      # de.gematik.isik 6.0.0 liefert im Registry keine Snapshots (0/158);
      # SUSHI kann die ISiK-Parents des Moduls ISiK sonst nicht importieren.
      # Priming aus dem cache-store-Branch des fhir-package-store (gebakte
      # Pakete mit Snapshots) — gleicher Mechanismus wie im ICU-Modul.
      - name: FHIR-Paket-Cache aus dem fhir-package-store laden (ISiK-Snapshots)
        uses: actions/checkout@v4
        with:
          repository: medizininformatik-initiative/fhir-package-store
          ref: cache-store
          path: .fhir-package-store
          persist-credentials: false

      - name: Paket-Cache nach ~/.fhir übernehmen
        run: |
          mkdir -p ~/.fhir/packages
          cp -r .fhir-package-store/packages/* ~/.fhir/packages/
          rm -rf .fhir-package-store
          ls ~/.fhir/packages | grep -c . 

      # Firely Terminal findet die MII-Ballot-Pakete (ballot.N / ballot2) im
      # Registry nicht und laesst sie beim Restore still aus (Run 37906216366:
      # dokument/mtb/pros/mikrobio fehlten, danach 427 Aufloesungsfehler im
      # .NET-Validator). SUSHI laedt sie problemlos. Daher vorab per
      # Direkt-Download in den Cache; Restore sieht sie dann als installiert.
      - name: MII-Ballot-Pakete direkt aus dem Registry in den Cache laden
        run: |
          set -euo pipefail
          mkdir -p ~/.fhir/packages
          for pv in \
            de.medizininformatikinitiative.kerndatensatz.dokument@2027.0.0-ballot.2 \
            de.medizininformatikinitiative.kerndatensatz.mtb@2027.0.0-ballot.1 \
            de.medizininformatikinitiative.kerndatensatz.pros@2027.0.0-ballot.1 \
            de.medizininformatikinitiative.kerndatensatz.mikrobiologie@2027.0.0-ballot2 \
            ihe.formatcode.fhir@1.4.0 \
            hl7.fhir.uv.xver-r5.r4@0.1.0; do
            name="${pv%@*}"; ver="${pv#*@}"; dest="$HOME/.fhir/packages/${name}#${ver}"
            if [ -d "$dest/package" ]; then echo "vorhanden: $pv"; continue; fi
            url="https://packages.simplifier.net/${name}/${ver}"
            [ "$name" = "hl7.fhir.uv.xver-r5.r4" ] && url="https://packages2.fhir.org/packages/${name}/${ver}"
            curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors "$url" -o /tmp/pkg.tgz
            mkdir -p "$dest" && tar xzf /tmp/pkg.tgz -C "$dest" && echo "geladen: $pv"
          done

      - name: Firely.Terminal (GitHub Actions)
        id: firely-terminal
        uses: FirelyTeam/firely-terminal-pipeline@v0.6.7
        with:
          PATH_TO_CONFORMANCE_RESOURCES: fsh-generated/resources
          PATH_TO_EXAMPLES: fsh-generated/resources
          DOTNET_VALIDATION_ENABLED: true
          JAVA_VALIDATION_ENABLED: false
          SIMPLIFIER_USERNAME: ${{ secrets.SIMPLIFIER_USERNAME }}
          SIMPLIFIER_PASSWORD: ${{ secrets.SIMPLIFIER_PASSWORD }}
          SUSHI_ENABLED: true
          SUSHI_VERSION: ${{ vars.SUSHI_VERSION || '3.20.1' }}


  JAVA_FHIR_VALIDATION:
    if: github.event_name != 'release'
    needs: DOTNET_FHIR_VALIDATION
    uses: medizininformatik-initiative/kerndatensatz-meta/.github/workflows/ci_java_validation.yml@master
    with:
      ref: ${{ github.event.pull_request.head.ref || github.ref }}
      PATH_TO_CONFORMANCE_RESOURCES: fsh-generated/resources
      PATH_TO_EXAMPLES: fsh-generated/resources
      JAVA_VALIDATION_ENABLED: true
      JAVA_VALIDATION_OPTIONS: ${{ vars.JAVA_VALIDATION_OPTIONS }}
      JAVA_VALIDATOR_VERSION: ${{ vars.JAVA_VALIDATOR_VERSION }}
    secrets: inherit

  BUILD_AND_DEPLOY_IG:
    if: github.ref == 'refs/heads/main' && github.event_name != 'release'
    needs: [DOTNET_FHIR_VALIDATION]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Jekyll
        run: gem install jekyll

      - name: Install SUSHI
        run: npm install -g fsh-sushi

      # de.gematik.isik 6.0.0 liefert im Registry keine Snapshots (0/158);
      # SUSHI kann die ISiK-Parents des Moduls ISiK sonst nicht importieren.
      # Priming aus dem cache-store-Branch des fhir-package-store (gebakte
      # Pakete mit Snapshots) — gleicher Mechanismus wie im ICU-Modul.
      - name: FHIR-Paket-Cache aus dem fhir-package-store laden (ISiK-Snapshots)
        uses: actions/checkout@v4
        with:
          repository: medizininformatik-initiative/fhir-package-store
          ref: cache-store
          path: .fhir-package-store
          persist-credentials: false

      - name: Paket-Cache nach ~/.fhir übernehmen
        run: |
          mkdir -p ~/.fhir/packages
          cp -r .fhir-package-store/packages/* ~/.fhir/packages/
          rm -rf .fhir-package-store
          ls ~/.fhir/packages | grep -c . 

      # Firely Terminal findet die MII-Ballot-Pakete (ballot.N / ballot2) im
      # Registry nicht und laesst sie beim Restore still aus (Run 37906216366:
      # dokument/mtb/pros/mikrobio fehlten, danach 427 Aufloesungsfehler im
      # .NET-Validator). SUSHI laedt sie problemlos. Daher vorab per
      # Direkt-Download in den Cache; Restore sieht sie dann als installiert.
      - name: MII-Ballot-Pakete direkt aus dem Registry in den Cache laden
        run: |
          set -euo pipefail
          mkdir -p ~/.fhir/packages
          for pv in \
            de.medizininformatikinitiative.kerndatensatz.dokument@2027.0.0-ballot.2 \
            de.medizininformatikinitiative.kerndatensatz.mtb@2027.0.0-ballot.1 \
            de.medizininformatikinitiative.kerndatensatz.pros@2027.0.0-ballot.1 \
            de.medizininformatikinitiative.kerndatensatz.mikrobiologie@2027.0.0-ballot2 \
            ihe.formatcode.fhir@1.4.0 \
            hl7.fhir.uv.xver-r5.r4@0.1.0; do
            name="${pv%@*}"; ver="${pv#*@}"; dest="$HOME/.fhir/packages/${name}#${ver}"
            if [ -d "$dest/package" ]; then echo "vorhanden: $pv"; continue; fi
            url="https://packages.simplifier.net/${name}/${ver}"
            [ "$name" = "hl7.fhir.uv.xver-r5.r4" ] && url="https://packages2.fhir.org/packages/${name}/${ver}"
            curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors "$url" -o /tmp/pkg.tgz
            mkdir -p "$dest" && tar xzf /tmp/pkg.tgz -C "$dest" && echo "geladen: $pv"
          done

      - name: Run SUSHI
        run: sushi .
        env:
          # ISiK 6 + transitive Pakete sprengen den 4-GB-Standard-Heap von Node;
          # ubuntu-latest (public repo) hat 16 GB RAM.
          NODE_OPTIONS: --max-old-space-size=12288

      - name: Download IG Publisher
        run: |
          mkdir -p input-cache
          curl -L https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar -o input-cache/publisher.jar

      - name: Run IG Publisher
        run: java -Xmx5g -jar input-cache/publisher.jar -ig ig.ini -tx n/a

      - name: Remove large files exceeding GitHub limit
        run: rm -f output/full-ig.zip

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          force_orphan: true

  RELEASE:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'release'
    needs: [DOTNET_FHIR_VALIDATION, JAVA_FHIR_VALIDATION]
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
